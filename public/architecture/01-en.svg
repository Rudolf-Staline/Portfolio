<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">From tabular records to an inspectable prediction</title><desc id="desc">Data: 782 patients, 53 raw variables → Comparison: SVM, RF, LightGBM and CatBoost → Evaluation and SHAP: Recall and prediction factors → Flask interface: Inspect predictions and explanations</desc><style>text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#f3f4ef}.subtitle{font-size:16px;fill:#c0c7bf}.number,.owner{font-size:12px;fill:#ed998a}.node{font-size:18px;font-weight:700;fill:#f3f4ef}.detail{font-size:14px;fill:#c0c7bf}.check{font-size:14px;fill:#f3f4ef}.note{font-size:13px;fill:#b8c0b7}</style><rect width="1240" height="570" fill="#1d211e"/><rect x="44" y="42" width="44" height="4" fill="#ed998a"/><text x="44" y="90" class="title">From tabular records to an inspectable prediction</text><text x="44" y="122" class="subtitle">Bring model evaluation and explanations into one academic prototype.</text><g><rect x="44" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="64" y="200" class="number">01</text><text x="64" y="236" class="node">Data</text><text x="64" y="266" class="detail">782 patients, 53 raw variables</text></g><path d="M 310 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="334" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="354" y="200" class="number">02</text><text x="354" y="236" class="node">Comparison</text><text x="354" y="266" class="detail">SVM, RF, LightGBM and CatBoost</text></g><path d="M 600 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="624" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="644" y="200" class="number">03</text><text x="644" y="236" class="node">Evaluation and SHAP</text><text x="644" y="266" class="detail">Recall and prediction factors</text></g><path d="M 890 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="914" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="934" y="200" class="number">04</text><text x="934" y="236" class="node">Flask interface</text><text x="934" y="266" class="detail">Inspect predictions and</text><text x="934" y="286" class="detail">explanations</text></g><path d="M44 382 H1174" stroke="#59625b"/><text x="44" y="416" class="check">4 model families</text><text x="429" y="416" class="check">Automated tests</text><text x="814" y="416" class="check">Academic prototype</text><text x="44" y="464" class="note">Simplified functional view. No clinical validation; this prototype is not intended for patient care.</text><text x="44" y="540" class="owner">Rudolf Hounlete / PediAppend</text></svg>