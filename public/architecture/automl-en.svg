<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">A checked evaluation, from CSV to export</title><desc id="desc">CSV and target: Feature audit and suspected leakage → Validation: Preprocessing fitted inside each fold → Optuna search: Fixed budget and SQLite trial tracking → Exports: Pipeline, predictions and HTML report</desc><style>text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#f3f4ef}.subtitle{font-size:16px;fill:#c0c7bf}.number,.owner{font-size:12px;fill:#ed998a}.node{font-size:18px;font-weight:700;fill:#f3f4ef}.detail{font-size:14px;fill:#c0c7bf}.check{font-size:14px;fill:#f3f4ef}.note{font-size:13px;fill:#b8c0b7}</style><rect width="1240" height="570" fill="#1d211e"/><rect x="44" y="42" width="44" height="4" fill="#ed998a"/><text x="44" y="90" class="title">A checked evaluation, from CSV to export</text><text x="44" y="122" class="subtitle">Checks are part of the pipeline, including after model training.</text><g><rect x="44" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="64" y="200" class="number">01</text><text x="64" y="236" class="node">CSV and target</text><text x="64" y="266" class="detail">Feature audit and suspected</text><text x="64" y="286" class="detail">leakage</text></g><path d="M 310 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="334" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="354" y="200" class="number">02</text><text x="354" y="236" class="node">Validation</text><text x="354" y="266" class="detail">Preprocessing fitted inside</text><text x="354" y="286" class="detail">each fold</text></g><path d="M 600 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="624" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="644" y="200" class="number">03</text><text x="644" y="236" class="node">Optuna search</text><text x="644" y="266" class="detail">Fixed budget and SQLite trial</text><text x="644" y="286" class="detail">tracking</text></g><path d="M 890 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="914" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="934" y="200" class="number">04</text><text x="934" y="236" class="node">Exports</text><text x="934" y="266" class="detail">Pipeline, predictions and HTML</text><text x="934" y="286" class="detail">report</text></g><path d="M44 382 H1174" stroke="#59625b"/><text x="44" y="416" class="check">393 tests</text><text x="429" y="416" class="check">Resumable trials</text><text x="814" y="416" class="check">File hashes and export readback</text><text x="44" y="464" class="note">Individual project, with Codex assisting development. Demonstrations cover classification, regression and synthetic</text><text x="44" y="485" class="note">leakage.</text><text x="44" y="540" class="owner">Rudolf Hounlete / Autonomous AutoML</text></svg>