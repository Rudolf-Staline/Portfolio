<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc" xml:lang="fr"><title id="title">Du registre à la réserve budgétaire</title><desc id="desc">Registre Excel: Risques, distributions et corrélations → Moteur Python: Scénarios de coûts Monte Carlo → Analyse: P50 / P80 / P90 et sensibilité → Interface React: Comparer, ajuster, relancer</desc><style>text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#f3f4ef}.subtitle{font-size:16px;fill:#c0c7bf}.number,.owner{font-size:12px;fill:#ed998a}.node{font-size:18px;font-weight:700;fill:#f3f4ef}.detail{font-size:14px;fill:#c0c7bf}.check{font-size:14px;fill:#f3f4ef}.note{font-size:13px;fill:#b8c0b7}</style><rect width="1240" height="570" fill="#1d211e"/><rect x="44" y="42" width="44" height="4" fill="#ed998a"/><text x="44" y="90" class="title">Du registre à la réserve budgétaire</text><text x="44" y="122" class="subtitle">Les hypothèses restent modifiables ; la restitution permet de comprendre leur effet sur le budget.</text><g><rect x="44" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="64" y="200" class="number">01</text><text x="64" y="236" class="node">Registre Excel</text><text x="64" y="266" class="detail">Risques, distributions et</text><text x="64" y="286" class="detail">corrélations</text><text x="64" y="320" class="owner">Rudolf</text></g><path d="M 310 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="334" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="354" y="200" class="number">02</text><text x="354" y="236" class="node">Moteur Python</text><text x="354" y="266" class="detail">Scénarios de coûts Monte Carlo</text><text x="354" y="320" class="owner">Daniel Awaga</text></g><path d="M 600 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="624" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="644" y="200" class="number">03</text><text x="644" y="236" class="node">Analyse</text><text x="644" y="266" class="detail">P50 / P80 / P90 et sensibilité</text><text x="644" y="320" class="owner">Restitution : Rudolf</text></g><path d="M 890 255 h 18 m -5 -5 l 5 5 -5 5" fill="none" stroke="#ed998a" stroke-width="2"/><g><rect x="914" y="170" width="260" height="170" rx="3" fill="#252b29" stroke="#59625b"/><text x="934" y="200" class="number">04</text><text x="934" y="236" class="node">Interface React</text><text x="934" y="266" class="detail">Comparer, ajuster, relancer</text><text x="934" y="320" class="owner">Rudolf</text></g><path d="M44 382 H1174" stroke="#59625b"/><text x="44" y="416" class="check">Matrice invalide refusée</text><text x="429" y="416" class="check">Scénarios synthétiques</text><text x="814" y="416" class="check">Distribution Windows locale</text><text x="44" y="464" class="note">Vue fonctionnelle simplifiée. Ma contribution couvre le registre, la restitution, l’analyse de sensibilité, l’interface</text><text x="44" y="485" class="note">et la distribution ; le moteur de calcul est porté par Daniel Awaga.</text><text x="44" y="540" class="owner">Rudolf Hounlete / RiskSim</text></svg>